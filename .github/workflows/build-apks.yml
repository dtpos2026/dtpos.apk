# ============================================================================
# Build the three Android apps on a runner that can reach Google.
#
# The Android Gradle Plugin, the platform and the build-tools are served only
# from dl.google.com, and nothing mirrors them. A machine that cannot reach that
# host fails while resolving the plugin, long before it compiles anything — so
# the reliable way to get an APK is here, where the SDK is preinstalled and the
# network is open.
#
# Nothing is generated at build time: this repository commits everything Gradle
# reads (see docs/WHY-VENDORED.md), so the job below is Java, the SDK, and
# gradlew. No npm install, no cap sync.
#
# The only step that needs Node is branding, and only when a restaurant is
# named. tools/ has no dependencies.
# ============================================================================
name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Which apps to build'
        type: choice
        default: 'all'
        options: ['all', 'Customer', 'Rider', 'OrderTaker']
      tenant_id:
        description: 'Restaurant UUID to brand for (blank = leave as committed)'
        required: false
        default: ''
      app_id:
        description: 'Android package id, e.g. com.digitaltarget.buttbbq (blank = keep)'
        required: false
        default: ''
      refresh_bundle:
        description: 'Rebuild the Customer web bundle from the POS repository'
        type: boolean
        default: false
      # Android refuses to install a build whose versionCode is not HIGHER than
      # the installed one. Every app here still ships versionCode 1, so a second
      # APK cannot update the first on any phone that has it — it fails with
      # INSTALL_FAILED_VERSION_DOWNGRADE and the customer has to uninstall
      # first, losing their session. Raise it on every release you hand out.
      version_code:
        description: 'Android versionCode — MUST be higher than the installed build (blank = keep)'
        required: false
        default: ''
      app_version:
        description: 'Version name shown to people, e.g. 1.1.0 (blank = keep)'
        required: false
        default: ''
      release:
        description: 'Signed release build instead of debug'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # ---- only when the Customer bundle is being refreshed from the POS repo
      - name: Check out the POS web app
        if: ${{ inputs.refresh_bundle }}
        uses: actions/checkout@v4
        with:
          repository: dtpos2026/digitaltarget.digital
          path: pos
          token: ${{ secrets.POS_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild the Customer web bundle
        if: ${{ inputs.refresh_bundle }}
        working-directory: pos
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          DT_APP_TENANT: ${{ inputs.tenant_id }}
        run: |
          npm ci
          npm run build:app

      - name: Copy it in
        if: ${{ inputs.refresh_bundle }}
        run: node tools/refresh-bundle.mjs --from pos

      # ---- brand, when a restaurant was named
      - name: Brand the apps
        if: ${{ inputs.tenant_id != '' || inputs.app_id != '' || inputs.version_code != '' || inputs.app_version != '' }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e
          for app in Customer Rider OrderTaker; do
            if [ "${{ inputs.apps }}" != "all" ] && [ "${{ inputs.apps }}" != "$app" ]; then continue; fi
            # The package id is only applied to the app it was given for; the
            # other two must keep their own, or all three collide on one id.
            id_flag=""
            if [ -n "${{ inputs.app_id }}" ] && [ "${{ inputs.apps }}" = "$app" ]; then
              id_flag="--id ${{ inputs.app_id }}"
            fi
            tenant_flag=""
            if [ -n "${{ inputs.tenant_id }}" ]; then tenant_flag="--tenant ${{ inputs.tenant_id }}"; fi
            # The version applies to every app being built, not just the one the
            # package id was given for: they are released together.
            ver_flag=""
            if [ -n "${{ inputs.app_version }}" ]; then ver_flag="--version ${{ inputs.app_version }}"; fi
            code_flag=""
            if [ -n "${{ inputs.version_code }}" ]; then code_flag="--version-code ${{ inputs.version_code }}"; fi
            echo "::group::brand $app"
            node tools/brand.mjs --app "$app" $tenant_flag $id_flag $ver_flag $code_flag
            echo "::endgroup::"
          done

      # The promise this repository makes -- everything Gradle reads is
      # committed, nothing is generated -- is easy to break by accident and
      # produces an error that names a file rather than the cause. Assert it
      # before spending eight minutes on Gradle.
      - name: Check the apps are buildable from a clean clone
        run: node tools/check.mjs

      - name: Decode the release keystore
        if: ${{ inputs.release }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::A release build needs ANDROID_KEYSTORE_BASE64. An unsigned release APK cannot be installed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Assemble
        env:
          DT_KEYSTORE_PATH: ${{ inputs.release && format('{0}/release.keystore', github.workspace) || '' }}
          DT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          task=${{ inputs.release && 'assembleRelease' || 'assembleDebug' }}
          for app in Customer Rider OrderTaker; do
            if [ "${{ inputs.apps }}" != "all" ] && [ "${{ inputs.apps }}" != "$app" ]; then continue; fi
            echo "::group::$app $task"
            (cd "$app" && chmod +x gradlew && ./gradlew --no-daemon "$task")
            echo "::endgroup::"
          done

      - name: Show what was produced
        run: |
          set -e
          found=0
          for apk in */app/build/outputs/apk/*/*.apk; do
            [ -e "$apk" ] || continue
            found=1
            printf '%-70s %s MB\n' "$apk" "$(du -m "$apk" | cut -f1)"
          done
          if [ "$found" = 0 ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dtpos-apks
          path: '*/app/build/outputs/apk/**/*.apk'
          if-no-files-found: error
