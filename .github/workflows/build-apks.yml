# ============================================================================
# Build the three Android apps on a runner that can reach Google.
#
# The Android Gradle Plugin, the platform and the build-tools are served only
# from dl.google.com, and nothing mirrors them. A machine that cannot reach that
# host fails while resolving the plugin, long before it compiles anything — so
# the reliable way to get an APK is here, where the SDK is preinstalled and the
# network is open.
#
# Nothing is generated at build time: this repository commits everything Gradle
# reads (see docs/WHY-VENDORED.md), so the job below is Java, the SDK, and
# gradlew. No npm install, no cap sync.
#
# The only step that needs Node is branding, and only when a restaurant is
# named. tools/ has no dependencies.
# ============================================================================
# THE THREE APPS THAT SHIP: Owner, Rider, Order Taker. The Customer app is parked (customers order on the website), so
# "all" builds the three and "everything" adds the Customer app. Each app is its own job, so the three build side by side
# and each one is its own downloadable file: DT-Owner, DT-Rider, DT-OrderTaker.
#
# Run it:   Actions -> Build Android APKs -> Run workflow   (pick the branch, leave "apps" on "all")
# Hand out: set the four ANDROID_* secrets once (docs/BUILD-ALL.md), tick "release", and tick "publish_release" to put
#           the three signed APKs on a GitHub Release with a stable download link.
name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Which apps to build (all = Owner + Rider + OrderTaker)'
        type: choice
        default: 'all'
        options: ['all', 'everything', 'Owner', 'Rider', 'OrderTaker', 'Customer']
      tenant_id:
        description: 'Restaurant UUID to brand for (blank = leave as committed)'
        required: false
        default: ''
      app_id:
        description: 'Android package id, e.g. com.digitaltarget.buttbbq (blank = keep)'
        required: false
        default: ''
      refresh_bundle:
        description: 'Rebuild the Customer web bundle from the POS repository'
        type: boolean
        default: false
      # Android refuses to install a build whose versionCode is not HIGHER than
      # the installed one (INSTALL_FAILED_VERSION_DOWNGRADE). So the default is
      # no longer "keep 1": a blank value uses this workflow's run number, which
      # rises with every run, and each build can update the one before it.
      version_code:
        description: 'Android versionCode (blank = this run number, which always rises)'
        required: false
        default: ''
      app_version:
        description: 'Version name shown to people, e.g. 1.1.0 (blank = keep)'
        required: false
        default: ''
      release:
        description: 'Signed release build instead of debug (needs the ANDROID_* secrets)'
        type: boolean
        default: false
      publish_release:
        description: 'Also put the APKs on a GitHub Release (needs "release" ticked)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which apps this run builds, as the matrix the next job fans out over.
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - id: pick
        shell: bash
        run: |
          case "${{ inputs.apps }}" in
            all)        apps='["Owner","Rider","OrderTaker"]' ;;
            everything) apps='["Owner","Rider","OrderTaker","Customer"]' ;;
            *)          apps='["${{ inputs.apps }}"]' ;;
          esac
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Building: $apps"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    name: build ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # setup-android's default is to run `sdkmanager tools` — the LEGACY SDK
      # Tools package, which Google removed. The action then exits 1 on
      # "Failed to find package 'tools'" and the build dies 20 seconds in,
      # before it has looked at a single source file. Nothing in this
      # repository changed; the hosted toolchain did.
      #
      # The runner image already ships the SDK, platform-tools and build-tools
      # this project needs (it is why the build lives here at all), so the
      # package list is emptied rather than replaced: nothing to fetch, nothing
      # to fail on.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      # ---- only when the Customer bundle is being refreshed from the POS repo
      - name: Check out the POS web app
        if: ${{ inputs.refresh_bundle && matrix.app == 'Customer' }}
        uses: actions/checkout@v4
        with:
          repository: dtpos2026/digitaltarget.digital
          path: pos
          token: ${{ secrets.POS_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ===== an unset secret was blanking the backend =====
      #
      # These used to be passed straight into the build step's env. A secret
      # that was never set arrives as an EMPTY STRING, and an empty VITE_*
      # variable OVERRIDES the committed .env — so the bundle was compiled with
      # no Supabase configuration at all.
      #
      # The APK that produced looks fine and cannot work: isSupabaseConfigured()
      # goes false, and customerAccount.ts turns that into the message
      #
      #     "You are offline. Connect to sign in."
      #
      # shown to a customer with full signal, on sign-up and on login alike.
      # Reported exactly that way. Proven by building the bundle twice, once
      # with the committed .env and once with empty variables: the second
      # carries no supabase.co URL anywhere in dist/client/assets.
      #
      # The desktop repo hit this same bug and fixed it in v1.28.6; this
      # workflow never got the fix. Exporting only what is actually set lets
      # the committed .env stand.
      - name: Resolve the Supabase build configuration
        if: ${{ inputs.refresh_bundle && matrix.app == 'Customer' }}
        shell: bash
        env:
          S_URL: ${{ secrets.VITE_SUPABASE_URL }}
          S_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$S_URL" ]; then
            echo "VITE_SUPABASE_URL=$S_URL" >> "$GITHUB_ENV"
            echo "using VITE_SUPABASE_URL from repository secrets"
          else
            echo "no VITE_SUPABASE_URL secret — the committed .env will be used"
          fi
          if [ -n "$S_KEY" ]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$S_KEY" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_ANON_KEY=$S_KEY" >> "$GITHUB_ENV"
          fi

      - name: Rebuild the Customer web bundle
        if: ${{ inputs.refresh_bundle && matrix.app == 'Customer' }}
        working-directory: pos
        env:
          DT_APP_TENANT: ${{ inputs.tenant_id }}
        run: |
          npm ci
          npm run build:app

      # Proving it rather than trusting the step above. A bundle with no
      # backend address produces an APK that opens, looks right, and tells
      # every customer they are offline — which is not something to discover
      # on a phone.
      - name: Verify the bundle carries a backend
        if: ${{ inputs.refresh_bundle && matrix.app == 'Customer' }}
        shell: bash
        working-directory: pos
        run: |
          if grep -rqE 'https://[a-z0-9]+\.supabase\.co' dist/client/assets/*.js; then
            echo "the bundle carries a Supabase URL"
          else
            echo "::error::The Customer bundle was built with NO Supabase configuration. Every sign-in would answer 'You are offline' on a phone with full signal. Check the VITE_SUPABASE_* secrets, or remove them so the committed .env is used."
            exit 1
          fi

      - name: Copy it in
        if: ${{ inputs.refresh_bundle && matrix.app == 'Customer' }}
        run: node tools/refresh-bundle.mjs --from pos

      # ---- version and brand.
      #
      # The version code is ALWAYS set: a blank input means this run's number, so a build handed out today can update the one
      # handed out last week. The package id and the restaurant only apply to the app they were given for.
      - name: Set the version (and brand, when a restaurant was named)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          APP: ${{ matrix.app }}
          IN_APPS: ${{ inputs.apps }}
          IN_TENANT: ${{ inputs.tenant_id }}
          IN_ID: ${{ inputs.app_id }}
          IN_VERSION: ${{ inputs.app_version }}
          IN_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          code="${IN_CODE:-$RUN_NUMBER}"
          flags="--version-code $code"
          if [ -n "$IN_VERSION" ]; then flags="$flags --version $IN_VERSION"; fi
          if [ -n "$IN_TENANT" ]; then flags="$flags --tenant $IN_TENANT"; fi
          # The package id is only applied when ONE app was asked for; with several, every app keeps its own id or they
          # would all collide on one.
          if [ -n "$IN_ID" ] && [ "$IN_APPS" = "$APP" ]; then flags="$flags --id $IN_ID"; fi
          echo "brand $APP: $flags"
          node tools/brand.mjs --app "$APP" $flags
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      # The promise this repository makes -- everything Gradle reads is
      # committed, nothing is generated -- is easy to break by accident and
      # produces an error that names a file rather than the cause. Assert it
      # before spending eight minutes on Gradle.
      - name: Check the apps are buildable from a clean clone
        run: node tools/check.mjs

      - name: Decode the release keystore
        if: ${{ inputs.release }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::A release build needs ANDROID_KEYSTORE_BASE64. An unsigned release APK cannot be installed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Assemble
        env:
          DT_KEYSTORE_PATH: ${{ inputs.release && format('{0}/release.keystore', github.workspace) || '' }}
          DT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          task=${{ inputs.release && 'assembleRelease' || 'assembleDebug' }}
          echo "::group::${{ matrix.app }} $task"
          (cd "${{ matrix.app }}" && chmod +x gradlew && ./gradlew --no-daemon "$task")
          echo "::endgroup::"

      # One clearly named file per app, so nobody has to guess which app-debug.apk is which.
      - name: Name the file
        id: name
        shell: bash
        run: |
          set -e
          kind=${{ inputs.release && 'release' || 'debug' }}
          src=$(ls "${{ matrix.app }}"/app/build/outputs/apk/$kind/*.apk | head -n 1)
          if [ -z "$src" ]; then echo "::error::No APK was produced for ${{ matrix.app }}."; exit 1; fi
          mkdir -p out
          dest="out/DT-${{ matrix.app }}-$kind-build${VERSION_CODE}.apk"
          cp "$src" "$dest"
          size=$(du -m "$dest" | cut -f1)
          echo "file=$dest" >> "$GITHUB_OUTPUT"
          printf '%-60s %s MB\n' "$dest" "$size"
          if [ "$kind" = "debug" ]; then
            echo "::notice title=${{ matrix.app }} is signed with a throw-away debug key::It installs, but a later build signed with a different key cannot update it. For an APK you hand out, tick 'release' (see docs/BUILD-ALL.md)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DT-${{ matrix.app }}
          path: out/*.apk
          if-no-files-found: error

  # One page that says what was built, and (when asked) one Release that holds the three signed APKs.
  publish:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: DT-*
          merge-multiple: true

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Android apps built"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in apks/*.apk; do echo "| \`$(basename "$f")\` | $(du -m "$f" | cut -f1) MB |"; done
            echo
            echo "Download each one from **Artifacts** at the bottom of this page."
            if [ "${{ inputs.release }}" != "true" ]; then
              echo
              echo "> These are **debug** builds, signed with a throw-away key. To hand out APKs that can be updated later, set the ANDROID_* secrets once and tick **release** (docs/BUILD-ALL.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish a GitHub Release
        if: ${{ inputs.publish_release && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="apps-build${{ github.run_number }}"
          gh release create "$tag" apks/*.apk \
            --repo "${{ github.repository }}" \
            --title "DT apps — build ${{ github.run_number }}" \
            --notes "Signed release APKs built from ${{ github.sha }}. Install over the previous build; the versionCode rises with every run."
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
